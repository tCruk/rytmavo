name: CI

on:
  push:
    branches: [main, 'develop/**', 'feature/**']
  pull_request:
    branches: [main, 'develop/**']

jobs:
  check:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  android-build:
    name: Android debug build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug
      # Wear OS companion module (android/wear); gradlew exists after the build above.
      - run: ./gradlew :wear:assembleDebug
        working-directory: android
