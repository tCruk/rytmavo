name: rytmavo
description: "Rytmavo – Schichtplanung und Gewohnheiten für Schichtarbeiter. Offline-first, keine Konten, keine Werbung."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  device_calendar_plus: ^0.10.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
